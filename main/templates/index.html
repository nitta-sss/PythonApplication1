{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Halu UI</title>
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
</head>
<body>

  <div class="header">
    <div class="user-box">
    <div class="icon"><img src="{% static 'img/face.png' %}" class="face-img"></div>
    <span class="username">Halu</span>
</div>

  </div>

  <div class="container">

    <!-- ★★★ 左エリア ★★★ -->
    <div class="left-area">
        <div class="chat-box">
        {% for msg in messages %}
            <div class="balloon {{ msg.sender }}">
                {{ msg.text }}
            </div>
        {% endfor %}
        </div>

        <div class="speak-icon">
            🗣
        </div>
    </div>


    <!-- ★★★ 右エリア ★★★ -->
    <div class="right-area">
        <!-- 背景画像＋ライトはCSSで設定 -->
        <img src="{% static 'img/windows.jpg' %}" class="right-back">

        <div class="face-area">
            <img src="{% static 'img/HaLu_Face.png' %}" class="face-img">
        </div>

        <!-- 感情ゲージ -->
        <div class="emotion-area">

            <div class="bar-item">
                <div class="bar-label">覚醒度</div>
                <div class="bar-base">
                    <div class="bar-fill fill1" id="awakeBar"></div>
                </div>
            </div>
            
            <div class="bar-item">
                <div class="bar-label">快楽度</div>
                <div class="bar-base">
                    <div class="bar-fill fill2" id="pleasureBar"></div>
                </div>
            </div>

        </div>

    </div>

</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const awakening = Number("{{ awakening }}");
        const pleasure  = Number("{{ pleasure }}");
    
        console.log("awakening =", awakening);
        console.log("pleasure =", pleasure);
    
        const awakeBar = document.getElementById("awakeBar");
        const pleasureBar = document.getElementById("pleasureBar");
    
        if (awakeBar && pleasureBar) {
            awakeBar.style.width = awakening + "%";
            pleasureBar.style.width = pleasure + "%";
        }
    });
    </script>
    
    

</body>
</html>
